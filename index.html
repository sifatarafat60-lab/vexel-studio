const sset=async()=>{const r=await sb.from('settings').upsert({id:1,data:S});msg=r.error?'Error: '+r.error.message:'Saved ✓';render();ar()};
const TY=v=>[['v','Video'],['th','Thumbnail'],['ba','Before / After'],['s','Short (vertical)']].map(([k,l])=>`<option value="${k}"${v==k?' selected':''}>${l}</option>`).join('');
function ar(){const a=$('#adm');if(!adm){a.innerHTML='';return}let h;
if(!user)h=`<h3>Admin sign in</h3><input id="le" type="email" placeholder="Email" autocomplete="email"><input id="lp" type="password" placeholder="Password (min 6)" autocomplete="current-password"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="si">Sign in</button><button class="btn o" id="su">Create account</button></div><p><small>${E(msg)}</small></p><p><small>Account create korle email confirm korte hobe. Shudhu admin email-er account edit korte parbe.</small></p>`;
else if(!isA())h=`<h3>Not authorised</h3><p><small>${E(user.email)} admin account na.</small></p><button class="btn o" id="so">Sign out</button>`;
else{const P={
 items:()=>I.map((x,n)=>`<div class="r"><input data-n="${n}" value="${E(x.title)}"><button class="btn o" data-m="${n}:-1">↑</button><button class="btn o" data-m="${n}:1">↓</button><button class="btn o" data-o="${n}">${op==n?'▲':'Edit'}</button><button class="btn o" data-d="${n}">✕</button></div>${op==n?`<div class="ex"><select data-e="t">${TY(x.t)}</select><input data-e="title" value="${E(x.title)}" placeholder="Title"><input data-e="tag" value="${E(x.tag)}" placeholder="Tag"><small>Main link (video / thumbnail / AFTER)</small><input data-e="a" value="${E(x.a)}"><input data-ef="a" type="file" accept="video/*,image/*"><small>BEFORE image link</small><input data-e="b" value="${E(x.b)}"><input data-ef="b" type="file" accept="image/*"><button class="btn" data-si="${n}" style="margin-top:8px">Save item</button></div>`:''}`).join('')||'<small>No items yet. Add tab use koro.</small>',
 add:()=>`<select id="nt">${TY('v')}</select><input id="nti" placeholder="Title"><input id="ntg" placeholder="Tag (e.g. YouTube)"><small>Main file (video / thumbnail / AFTER / short)</small><input id="nf" type="file" accept="video/*,image/*"><input id="nu" placeholder="…or paste YouTube / Drive / file URL"><small>BEFORE image (only Before / After)</small><input id="nb" type="file" accept="image/*"><button class="btn" id="add" style="margin-top:8px">Add</button>`,
 sv:()=>(S.sv||[]).map((v,i)=>`<div class="ex"><input data-sh="${i}" value="${E(v.h)}" placeholder="Service title"><input data-sp="${i}" value="${E(v.p)}" placeholder="Description"><button class="btn o" data-sd="${i}" style="margin-top:6px">Delete</button></div>`).join('')+`<button class="btn" id="sa" style="margin-top:8px">+ Add service</button>`,
 site:()=>[['br','Brand name'],['bd','Badge text (empty = hide)'],['h','Headline'],['h2','Italic headline'],['sub','Subtext'],['email','Email'],['wa','WhatsApp number (no +)'],['ig','Instagram link'],['yt','YouTube link'],['fb','Facebook link'],['be','Behance link'],['ft','Footer name']].map(([k,l])=>`<small>${l}</small><input data-s="${k}" value="${E(S[k])}">`).join('')+'<h3>Colors</h3>'+CO.map(([k,l,d])=>`<small>${l}</small><div class="r"><input type="color" data-s="${k}" value="${E(S[k]||d)}"><button class="btn o" data-rc="${k}">Reset</button></div>`).join('')+'<small>Reset dile theme er default color fire ashbe.</small>'};
 h=`<div class="tb">${[['items','Items'],['add','Add'],['sv','Services'],['site','Site']].map(([k,v])=>`<button class="btn ${tab==k?'':'o'}" data-t="${k}">${v}</button>`).join('')}</div><small>${E(user.email)}</small> <button class="btn o" id="so" style="padding:3px 12px">Sign out</button> <small>${E(msg)}</small>${P[tab]()}<p><small>Sob change sathe sathe live hoy.</small></p>`}
a.innerHTML=`<div class="sh"><div class="sb"><div class="hd"><h3 class="g" style="margin:0">Admin panel</h3><button class="btn o" id="x">Close</button></div>${h}</div></div>`;
$('#x').onclick=()=>{adm=0;ar()};const g=id=>$(id),Q=k=>a.querySelectorAll(k);
if(g('#si'))g('#si').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('#le').value,password:$('#lp').value});msg=r.error?r.error.message:'';ar()};
if(g('#su'))g('#su').onclick=async()=>{const r=await sb.auth.signUp({email:$('#le').value,password:$('#lp').value});msg=r.error?r.error.message:'Check your email to confirm, then sign in.';ar()};
if(g('#so'))g('#so').onclick=()=>sb.auth.signOut();
if(!isA())return;
const ck=(r,ok)=>{if(r&&r.error){msg='Error: '+r.error.message;ar()}else{msg='Saved ✓';ok()}};
Q('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;op=-1;msg='';ar()});
Q('[data-s]').forEach(i=>i.onchange=()=>{S[i.dataset.s]=i.value;sset()});
Q('[data-rc]').forEach(b=>b.onclick=()=>{S[b.dataset.rc]='';sset()});
Q('[data-sh]').forEach(i=>i.onchange=()=>{S.sv[i.dataset.sh].h=i.value;sset()});
Q('[data-sp]').forEach(i=>i.onchange=()=>{S.sv[i.dataset.sp].p=i.value;sset()});
Q('[data-sd]').forEach(b=>b.onclick=()=>{S.sv.splice(b.dataset.sd,1);sset()});
if(g('#sa'))g('#sa').onclick=()=>{(S.sv=S.sv||[]).push({h:'New service',p:'Describe it'});sset()};
Q('[data-n]').forEach(i=>i.onchange=async()=>{const x=I[i.dataset.n];x.title=i.value;ck(await sb.from('items').update({title:x.title}).eq('id',x.id),()=>{render();ar()})});
Q('[data-o]').forEach(b=>b.onclick=()=>{op=op==b.dataset.o?-1:+b.dataset.o;ar()});
Q('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete?'))return;ck(await sb.from('items').delete().eq('id',I[b.dataset.d].id),()=>{op=-1;load()})});
Q('[data-m]').forEach(b=>b.onclick=async()=>{const[n,d]=b.dataset.m.split(':').map(Number),j=n+d;if(j<0||j>=I.length)return;const x=I[n],y=I[j];await sb.from('items').update({pos:y.pos}).eq('id',x.id);await sb.from('items').update({pos:x.pos}).eq('id',y.id);op=-1;load()});
Q('[data-si]').forEach(b=>b.onclick=async()=>{const x=I[+b.dataset.si],w=b.closest('.ex'),v=k=>w.querySelector(`[data-e=${k}]`).value;try{msg='Saving…';ar();const fa=w.querySelector('[data-ef=a]').files[0],fb=w.querySelector('[data-ef=b]').files[0];
 const r=await sb.from('items').update({t:v('t'),title:v('title'),tag:v('tag'),a:(await up(fa))||v('a').trim(),b:(await up(fb))||v('b').trim()}).eq('id',x.id);if(r.error)throw r.error;msg='Saved ✓';op=-1;load()}catch(e){msg='Error: '+(e.message||'failed');ar()}});
if(g('#add'))g('#add').onclick=async()=>{try{const T=$('#nt').value,Ti=$('#nti').value||'Untitled',Tg=$('#ntg').value,Fa=$('#nf').files[0],Fb=$('#nb').files[0],U=$('#nu').value.trim();msg='Uploading…';ar();const row={t:T,title:Ti,tag:Tg,a:(await up(Fa))||U,b:await up(Fb),pos:-Date.now()};
 const r=await sb.from('items').insert(row);if(r.error)throw r.error;msg='Added ✓';tab='items';load()}catch(e){msg='Error: '+(e.message||'failed');ar()}}}
sb.auth.onAuthStateChange((_,s)=>{user=s?s.user:null;if(adm)ar()});
sb.auth.getSession().then(r=>{user=r.data.session?r.data.session.user:null});
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
 const R=110,rs=x=>{x.style.removeProperty('--x');x.style.removeProperty('--y')};let px=0,py=0,pt=null,ra=0;
 const tick=()=>{ra=0;const h=pt&&pt.closest?pt.closest('h1,h2'):null;
  document.querySelectorAll('h1,h2').forEach(x=>{if(x===h){const b=x.getBoundingClientRect();x.style.setProperty('--x',px-b.left+'px');x.style.setProperty('--y',py-b.top+'px')}else rs(x)});
  document.querySelectorAll('.c').forEach(c=>{const b=c.getBoundingClientRect(),dx=Math.max(b.left-px,0,px-b.right),dy=Math.max(b.top-py,0,py-b.bottom),d=Math.hypot(dx,dy),o=d<R?1-d/R:0;
   if(o===0&&c._o===0)return;c._o=o;c.style.setProperty('--cx',px-b.left+'px');c.style.setProperty('--cy',py-b.top+'px');c.style.setProperty('--o',o.toFixed(2))})};
 addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;pt=e.target;if(!ra)ra=requestAnimationFrame(tick)},{passive:true});
 document.documentElement.addEventListener('pointerleave',()=>{pt=null;px=py=-9999;if(!ra)ra=requestAnimationFrame(tick)})}
document.body.insertAdjacentHTML('afterbegin','<div class="bgm"><i></i><i></i><i></i></div>');
render();load();
</script></body></html>
